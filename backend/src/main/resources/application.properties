# ===================================================================
# ABHEDYA AI — Enterprise Disaster Management & Relocation Platform
# Main Configuration
# ===================================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Active Spring Profile (default: dev; set to postgres for PostgreSQL + PostGIS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Metadata
app.name=ABHEDYA AI Disaster Command Center
app.version=1.0.0
app.environment=${APP_ENV:development}

# Logging Configuration
logging.level.root=INFO
logging.level.com.abhedya.ai=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# Weather Integration (Open-Meteo) Configuration
# ===================================================================
app.weather.open-meteo-base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
app.weather.connect-timeout-ms=${WEATHER_CONNECT_TIMEOUT_MS:4000}
app.weather.read-timeout-ms=${WEATHER_READ_TIMEOUT_MS:5000}
app.weather.cache-ttl-seconds=${WEATHER_CACHE_TTL_SECONDS:900}
app.weather.max-retries=${WEATHER_MAX_RETRIES:2}
app.weather.retry-backoff-ms=${WEATHER_RETRY_BACKOFF_MS:500}

# Meteorological Alert Thresholds (IMD Standards)
app.weather.thresholds.rainfall-advisory-mm=25.0
app.weather.thresholds.rainfall-watch-mm=64.5
app.weather.thresholds.rainfall-warning-mm=115.5
app.weather.thresholds.rainfall-emergency-mm=204.5
app.weather.thresholds.wind-advisory-kmh=40.0
app.weather.thresholds.wind-watch-kmh=50.0
app.weather.thresholds.wind-warning-kmh=75.0
app.weather.thresholds.wind-emergency-kmh=90.0

# ===================================================================
# OSRM Road Routing Engine Configuration
# ===================================================================
app.routing.osrm-base-url=${OSRM_BASE_URL:http://router.project-osrm.org}
app.routing.connect-timeout-ms=${OSRM_CONNECT_TIMEOUT_MS:4000}
app.routing.read-timeout-ms=${OSRM_READ_TIMEOUT_MS:6000}
app.routing.max-retries=${OSRM_MAX_RETRIES:2}
app.routing.retry-backoff-ms=${OSRM_RETRY_BACKOFF_MS:500}



